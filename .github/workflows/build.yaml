name: README build
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit
        run: |
          git diff
          git config --global user.email "github-actions-bot@abhijitam01.github.io"
          git config --global user.name "Abhijitam01/GitHub-Actions-Bot"
          git add dark_mode.svg light_mode.svg
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push
